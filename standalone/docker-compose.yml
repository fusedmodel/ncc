# NCC Registry · Standalone / 内部 Registry 部署
# 一键拉起：ncc（API+计费+SPA）+ MinIO（S3 兼容对象存储，可替换为 Ceph RGW）
services:
  ncc:
    build:
      context: ../..      # 仓库根（ncc-platform/server、ncc-platform/web 在其下）
      dockerfile: opensource-project/standalone/Dockerfile
    ports:
      - "8181:8181"
    environment:
      NCC_PORT: "8181"
      NCC_DATA_DIR: /data
      NCC_WEB_DIST: /app/web
      NCC_PUBLIC_BASE: http://localhost:8181
      # 存储驱动：s3（Ceph RGW / MinIO / AWS S3 兼容）；改为 local 则用本地磁盘
      NCC_STORAGE_DRIVER: s3
      NCC_S3_ENDPOINT: http://minio:9000
      NCC_S3_REGION: us-east-1
      NCC_S3_ACCESS_KEY: ${NCC_S3_ACCESS_KEY:-nccadmin}
      NCC_S3_SECRET_KEY: ${NCC_S3_SECRET_KEY:-nccadmin123}
      NCC_S3_BUCKET: ncc
      NCC_S3_PUBLIC_BASE: http://localhost:9000/ncc
    volumes:
      - ncc-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NCC_S3_ACCESS_KEY:-nccadmin}
      MINIO_ROOT_PASSWORD: ${NCC_S3_SECRET_KEY:-nccadmin123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 控制台
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # 创建桶并开放匿名下载（公开条目需要可被直接下载）
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set ncc http://minio:9000 $${NCC_S3_ACCESS_KEY:-nccadmin} $${NCC_S3_SECRET_KEY:-nccadmin123} 2>/dev/null; do sleep 2; done;
      mc mb --ignore-existing ncc/ncc;
      mc anonymous set download ncc/ncc;
      exit 0
      "

volumes:
  ncc-data:
  minio-data:
