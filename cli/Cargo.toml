[package]
name = "ncc"
version = "0.1.3"
edition = "2021"
description = "Official command-line client for NCC Registry — publish, search, install and download capability artifacts (API / Skill / MCP / Harness / Plugin / Scaffold)."
license = "Apache-2.0"
repository = "https://github.com/fusedmodel/ncc"
homepage = "https://ncc.ai"
keywords = ["ncc", "registry", "capability", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ncc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
anyhow = "1"
# `ncc upgrade` 用它比对 release 里的 checksums.txt —— 校验不过就拒绝替换。
# 纯 Rust、无 C 依赖，不影响交叉编译。
sha2 = "0.10"
ratatui = "0.26"
crossterm = "0.27"

[profile.release]
strip = true
lto = true
