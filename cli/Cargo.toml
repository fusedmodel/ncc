[package]
name = "ncc"
version = "0.1.0"
edition = "2021"
description = "ncc.ai Registry 命令行客户端（Rust）—— ncc <command>"

[[bin]]
name = "ncc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
anyhow = "1"
ratatui = "0.26"
crossterm = "0.27"

[profile.release]
strip = true
lto = true
